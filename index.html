<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ocean Run</title>
<style>
  html, body { margin: 0; height: 100%; background: #05070a; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #hud {
    position: fixed; left: 16px; bottom: 16px; max-width: 380px;
    font: 12px/1.6 system-ui, -apple-system, Segoe UI, sans-serif; color: #e9eef3;
    background: rgba(8, 12, 18, .62); border: 1px solid rgba(255,255,255,.08);
    border-radius: 10px; padding: 10px 14px; backdrop-filter: blur(6px);
    display: none; user-select: none;
  }
  #hud b { color: #ffd2a6; font-weight: 600; }
  #hud kbd { font: 11px ui-monospace, monospace; padding: 0 4px; border-radius: 3px; background: rgba(255,255,255,.12); }
  #rec { position: fixed; right: 16px; top: 16px; font: 600 12px system-ui, sans-serif; color: #fff;
    background: #c62828; border-radius: 6px; padding: 4px 10px; display: none; }
  #err { position: fixed; inset: 0; display: none; place-items: center; color: #ccd; font: 15px system-ui, sans-serif; text-align: center; padding: 16px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"></div>
<div id="rec">REC</div>
<div id="err">This wallpaper needs WebGL2. Try a recent Chrome, Edge, Firefox or Safari.</div>

<script id="fs" type="x-shader/x-fragment">#version 300 es
precision highp float;
out vec4 fragColor;

#define NW 36
#define NMARCH 12
#define NSPRAY 96

uniform vec2  uRes;
uniform float uTime, uLoop, uV, uH, uFov, uSeed;
uniform vec4  uW0[NW];   // dir.x, dir.z, frequency (1/unit), weight
uniform float uPh[NW];   // current phase of each wave (loop-quantised, set from JS)
uniform vec3  uCamPos, uCamTgt, uCamUp;
uniform mat3  uBoatR;
uniform vec3  uBoatP;
uniform vec2  uBoatSlope; // dy/dx, dy/dz of the boat's waterline plane
uniform float uSpray, uWake;
uniform int   uBoat;      // 0 motor yacht, 1 galleon, 2 fishing boat, 3 sailing yacht
uniform vec4  uH0;        // bow x, stern distance, half beam, draft
uniform vec4  uH1;        // deck height aft, sheer rise to the bow, deadrise, keel rise
uniform vec4  uH2;        // keel rise start x, bow plan power, aft castle, fore castle
uniform vec4  uH3;        // bounding sphere centre x, y, radius; x where the bow meets the water
uniform vec4  uCock;      // open deck: centre x, half length, side inset, depth
uniform vec3  uLightP[4];
uniform vec3  uLightC[4];
uniform vec3  uSunDir, uSunCol, uZenith, uHorizon, uSunHaze, uCloudCol, uWaterDeep, uWaterScat;
uniform float uCover, uExposure, uFoam, uLights, uStars, uFlash, uGrain;
uniform vec3  uFlashDir;

const float U = 8.0;        // metres per wave unit
const float DRAG = 0.28;    // wave domain drag (sharpens crests, bunches small waves on big ones)
const float PI = 3.14159265;
#define LB uH0.x
#define LS uH0.y
#define HB uH0.z
#define DRAFT uH0.w
#define XB uH3.w

// ---------------------------------------------------------------- noise
float hash11(float p) { p = fract(p * .1031); p *= p + 33.33; p *= p + p; return fract(p); }
float hash12(vec2 p) { vec3 p3 = fract(vec3(p.xyx) * .1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
float hash13(vec3 p3) { p3 = fract(p3 * .1031); p3 += dot(p3, p3.zyx + 31.32); return fract((p3.x + p3.y) * p3.z); }
float vnoise(vec2 p) {
  vec2 i = floor(p), f = fract(p);
  vec2 u = f * f * (3. - 2. * f);
  return mix(mix(hash12(i), hash12(i + vec2(1, 0)), u.x),
             mix(hash12(i + vec2(0, 1)), hash12(i + vec2(1, 1)), u.x), u.y);
}
float fbm(vec2 p, int oct) {
  float a = .5, s = 0.;
  mat2 m = mat2(1.6, 1.2, -1.2, 1.6);
  for (int i = 0; i < 6; i++) { if (i >= oct) break; s += a * vnoise(p); p = m * p; a *= .5; }
  return s;
}
// Noise advected with velocity `vel` that loops exactly every uLoop seconds:
// two copies one loop apart are cross-faded, with the contrast restored.
float fbmFlow(vec2 p, vec2 vel, int oct) {
  float a = uTime / uLoop;
  float n1 = fbm(p + vel * uTime, oct);
  float n2 = fbm(p + vel * (uTime - uLoop), oct);
  float mean = .5 * (1. - exp2(-float(oct)));
  float m = mix(n1, n2, a);
  return mean + (m - mean) / sqrt((1. - a) * (1. - a) + a * a);
}

// ---------------------------------------------------------------- hull shape (boat-local: +x bow, +y up, +z starboard)
float hullHW(float x) {
  return x > 0. ? HB * (1. - pow(clamp(x / LB, 0., 1.), uH2.y))
                : HB * (1. - (uBoat == 1 ? .3 : .06) * pow(clamp(-x / LS, 0., 1.), 2.));
}
float sheer(float x) {
  float s = uH1.x + uH1.y * pow(smoothstep(-LS, LB, x), 2.);
  if (uBoat == 1) s += uH2.z * smoothstep(-LS * .4, -LS * .6, x) + uH2.w * smoothstep(LB * .5, LB * .68, x);
  return s;
}
float hullFlare(float y) {
  if (uBoat == 1) return 1. - .13 * smoothstep(0., uH1.x + 3., y) - .1 * smoothstep(0., -DRAFT, y);  // tumblehome
  if (uBoat == 3) return .82 + .18 * smoothstep(-DRAFT, .5, y);
  return .84 + .16 * smoothstep(-.7, 1.2, y);
}

// ---------------------------------------------------------------- ocean
float wavesRaw(vec2 p, int n) {
  vec2 q = p / U;
  float sv = 0., sw = 0.;
  for (int i = 0; i < NW; i++) {
    if (i >= n) break;
    vec4 w = uW0[i];
    float x = dot(w.xy, q) * w.z + uPh[i];
    float e = exp(sin(x) - 1.);
    q -= w.xy * (e * cos(x)) * w.w * DRAG;
    sv += e * w.w; sw += w.w;
  }
  return sv / sw;
}

// Bow wave, Kelvin wake arms, transverse wake waves and the prop-wash hump.
// Static in the boat frame, so it never breaks the loop.
float wakeH(vec2 p) {
  float sb = XB - p.x;
  if (sb < -2.5 || sb > 220.) return 0.;
  float az = abs(p.y);
  float arm = HB * .85 + max(sb, 0.) * mix(.3, .2, smoothstep(6., 12., uV));
  float armW = .45 + max(sb, 0.) * .045;
  float decay = exp(-max(sb, 0.) * .03) * smoothstep(-2.5, .5, sb);
  float h = .3 * exp(-pow((az - arm) / armW, 2.)) * decay;
  h -= .14 * exp(-pow((az - arm + armW * 1.9) / (armW * 1.3), 2.)) * decay * smoothstep(0., 3., sb);
  float inside = smoothstep(arm, arm - 4., az);
  float lam = 2. * PI * uV * uV / 9.81;
  h += .12 * cos(sb * 2. * PI / lam) * inside * exp(-sb * .018) * smoothstep(5., 14., sb);
  float ss = -LS - p.x;
  if (ss > -1.) h += .18 * exp(-pow(p.y / (HB * .8 + max(ss, 0.) * .06), 2.)) * exp(-max(ss, 0.) * .07) * smoothstep(-1., 1., ss);
  return h * uWake;
}

// The hull displaces the sea: close to it the surface is pulled onto the boat's waterline
// plane, so the boat sits *in* the water instead of hovering over troughs.
float hullMask(vec2 p) {
  float dx = max(max(p.x - XB - 1.2, -LS - .3 - p.x), 0.);
  float dz = max(abs(p.y) - hullHW(clamp(p.x, -LS, XB)) * .9, 0.);
  return exp(-(dx * dx + dz * dz) * .2);
}
float seaH(vec2 p, float raw) {
  float h = (raw - .466) * uH;
  float m = hullMask(p);
  if (m > .002) h = mix(h, uBoatP.y + dot(uBoatSlope, p) - .03, min(m * 1.1, 1.));
  return h + wakeH(p) * (1. - m);
}
float waterH(vec2 p, int n) { return seaH(p, wavesRaw(p, n)); }

float traceWater(vec3 ro, vec3 rd) {
  float top = .534 * uH + .8, bot = -.466 * uH - .5;
  if (rd.y >= -1e-4) return -1.;
  float t = max((top - ro.y) / rd.y, 0.);
  float t1 = (bot - ro.y) / rd.y;
  if (t > 6000.) return t;
  for (int i = 0; i < 120; i++) {
    vec3 p = ro + rd * t;
    float gap = p.y - waterH(p.xz, NMARCH);
    if (gap < .01 * (1. + t * .01)) break;
    t += max(gap * .9, t * .0012);
    if (t > t1) { t = t1; break; }
  }
  return t;
}

// ---------------------------------------------------------------- boat SDF
float sdBox(vec3 p, vec3 b) { vec3 q = abs(p) - b; return length(max(q, 0.)) + min(max(q.x, max(q.y, q.z)), 0.); }
float sdRBox(vec3 p, vec3 b, float r) { return sdBox(p, b - r) - r; }
float sdCap(vec3 p, vec3 a, vec3 b, float r) { vec3 pa = p - a, ba = b - a; float h = clamp(dot(pa, ba) / dot(ba, ba), 0., 1.); return length(pa - ba * h) - r; }
float sdCyl(vec3 p, float r, float h) { vec2 d = abs(vec2(length(p.xz), p.y)) - vec2(r, h); return min(max(d.x, d.y), 0.) + length(max(d, 0.)); }
float sdTri2(vec2 p, vec2 p0, vec2 p1, vec2 p2) {
  vec2 e0 = p1 - p0, e1 = p2 - p1, e2 = p0 - p2;
  vec2 v0 = p - p0, v1 = p - p1, v2 = p - p2;
  vec2 pq0 = v0 - e0 * clamp(dot(v0, e0) / dot(e0, e0), 0., 1.);
  vec2 pq1 = v1 - e1 * clamp(dot(v1, e1) / dot(e1, e1), 0., 1.);
  vec2 pq2 = v2 - e2 * clamp(dot(v2, e2) / dot(e2, e2), 0., 1.);
  float s = sign(e0.x * e2.y - e0.y * e2.x);
  vec2 d = min(min(vec2(dot(pq0, pq0), s * (v0.x * e0.y - v0.y * e0.x)),
                   vec2(dot(pq1, pq1), s * (v1.x * e1.y - v1.y * e1.x))),
                   vec2(dot(pq2, pq2), s * (v2.x * e2.y - v2.y * e2.x)));
  return -sqrt(d.x) * sign(d.y);
}
// Triangular sail: tack A, head B, clew C, bellied out along the sail normal by `camber`.
float sdSail(vec3 p, vec3 A, vec3 B, vec3 C, float camber) {
  vec3 u = normalize(B - A);
  vec3 w = normalize(cross(u, C - A));
  vec3 v = cross(w, u);
  vec3 q = p - A;
  vec2 pp = vec2(dot(q, u), dot(q, v));
  float bl = length(B - A);
  vec2 c2 = vec2(dot(C - A, u), dot(C - A, v));
  float leech = c2.y * clamp((bl - pp.x) / (bl - c2.x), 0., 1.);
  float f = clamp(pp.y / max(leech, .05), 0., 1.);
  float off = camber * 4. * f * (1. - f) * (1. - .55 * clamp(pp.x / bl, 0., 1.));
  float sheet = abs(dot(q, w) - off) - .03;
  return max(sheet * .75, sdTri2(pp, vec2(0), vec2(bl, 0.), c2));
}
// Square sail hanging from a yard, billowing forward.
float sdSquareSail(vec3 p, float mx, float y0, float y1, float w0, float w1, float bulge) {
  float h = .5 * (y1 - y0), yc = .5 * (y0 + y1);
  float fy = (p.y - yc) / h;
  float w = mix(w0, w1, clamp((p.y - y0) / (y1 - y0), 0., 1.));
  float fz = clamp(p.z / w, -1., 1.);
  float off = bulge * (1. - fy * fy * .5) * (1. - fz * fz);
  float sheet = abs(p.x - mx - off) - .05;
  return max(sheet * .7, max(abs(p.z) - w, abs(p.y - yc) - h));
}

float sdHullSolid(vec3 p) {
  float hwx = hullHW(p.x);
  float hw = hwx * hullFlare(p.y);
  float rise = pow(max(p.x - uH2.x, 0.), 2.) * uH1.w;
  float yb;
  if (uBoat == 1 || uBoat == 3) { float u = abs(p.z) / max(hwx, .05); yb = -DRAFT + DRAFT * .95 * u * u + rise; }
  else yb = -DRAFT + abs(p.z) * uH1.z + rise;
  float d = abs(p.z) - hw;
  d = max(d, yb - p.y);
  d = max(d, p.y - sheer(p.x));
  float aft = -p.x - LS;
  if (uBoat == 1) aft -= max(p.y, 0.) * .18;            // overhanging stern castle
  if (uBoat == 3) aft += max(p.y - .3, 0.) * .3;        // reverse transom
  d = max(d, aft);
  d = max(d, p.x - LB);
  return d * .6;
}

// materials: 1 hull, 2 deck, 3 superstructure, 4 glass, 5 metal, 6 white top, 7 canvas,
// 8 dark wood, 9 cushion, 10 rope, 11 yellow, 12 green, 13 black, 14 lantern
void opU(inout vec2 r, float d, float m) { if (d < r.x) r = vec2(d, m); }

vec2 mapBoat(vec3 p) {
  float hull = sdHullSolid(p);
  vec2 r = vec2(hull, 1.);
  if (uCock.y > 0.) {
    float cock = max(max(abs(p.x - uCock.x) - uCock.y, abs(p.z) - (hullHW(p.x) * .97 - uCock.z)), (sheer(p.x) - uCock.w) - p.y);
    r = vec2(max(hull, -cock), -cock > hull ? 2. : 1.);
  }
  if (r.y == 1. && p.y > sheer(p.x) - .03 && abs(p.z) < hullHW(p.x) * hullFlare(p.y) - .06) r.y = 2.;
  vec3 s = vec3(p.x, p.y, abs(p.z));

  if (uBoat == 0) {
    // ---- motor yacht: long saloon with a wrap-around tinted window band, flybridge, hardtop
    float sal = max(max(abs(p.x + .6) - 5., abs(p.y - 2.4) - .8), abs(p.z) - hullHW(p.x) * .84);
    sal = max(sal, dot(p - vec3(2.9, 3.2, 0.), normalize(vec3(.8, 1., 0.))));
    opU(r, sal, (p.y > 2.05 && p.y < 2.95) ? 4. : 3.);
    opU(r, sdRBox(p - vec3(-1.6, 3.28, 0.), vec3(3.5, .1, 2.), .05), 3.);
    opU(r, max(sdRBox(p - vec3(.9, 3.6, 0.), vec3(.9, .3, 1.75), .1), dot(p - vec3(1.4, 3.9, 0.), normalize(vec3(1., 1.4, 0.)))), 4.);
    opU(r, sdRBox(p - vec3(-2.9, 3.55, 0.), vec3(1., .2, 1.4), .12), 9.);
    opU(r, sdRBox(p - vec3(-3.1, 4.55, 0.), vec3(1.7, .07, 1.75), .05), 6.);
    float post = min(sdCap(s, vec3(-.9, 3.35, 1.75), vec3(-1.4, 4.5, 1.6), .07), sdCap(s, vec3(-4.6, 3.35, 1.75), vec3(-4.1, 4.5, 1.6), .07));
    opU(r, post, 6.);
    opU(r, sdCyl(p - vec3(-2.5, 4.72, 0.), .45, .08), 6.);
    opU(r, sdCap(p, vec3(-3.4, 4.6, 0.), vec3(-3.4, 5.5, 0.), .03), 5.);
    opU(r, sdRBox(p - vec3(6.1, sheer(6.1) + .1, 0.), vec3(1.5, .14, 1.15), .1), 9.);
    opU(r, sdBox(p - vec3(-LS - .8, .45, 0.), vec3(.85, .06, 2.2)), 2.);
    opU(r, sdCap(s, vec3(2.6, sheer(2.6) + .6, hullHW(2.6) - .12), vec3(9.6, sheer(9.6) + .5, .05), .025), 5.);
  } else if (uBoat == 1) {
    // ---- galleon: three masts of square sails, jibs on the bowsprit, rigging
    opU(r, sdCap(p, vec3(LB - 1., 5.6, 0.), vec3(LB + 9.5, 9.6, 0.), .22), 8.);
    // rail along the waist
    opU(r, sdCap(s, vec3(-LS * .4, sheer(0.) + .8, hullHW(-4.) * .86), vec3(LB * .5, sheer(0.) + .8, hullHW(6.) * .86), .08), 8.);
    for (int i = 0; i < 3; i++) {
      float mx = i == 0 ? 8. : i == 1 ? .5 : -7.5;
      float sc = i == 0 ? .9 : i == 1 ? 1. : .72;
      float top = 3. + 27. * sc;
      float bb = sdBox(p - vec3(mx + .8, (3. + top) * .5, 0.), vec3(2.8, (top - 3.) * .5 + .4, 7.8 * sc));
      if (bb > r.x) continue;   // nothing on this mast can be nearer than what we already have
      opU(r, sdCap(p, vec3(mx, 2., 0.), vec3(mx, top, 0.), .3 * sc), 8.);
      // yards are braced round to the wind
      vec3 m = p - vec3(mx, 0., 0.);
      m.xz = mat2(.82, -.57, .57, .82) * m.xz;
      opU(r, sdCyl(p - vec3(mx, 3. + sc * 10.6, 0.), 1.1 * sc, .07), 8.);
      for (int j = 0; j < 3; j++) {
        float fj = float(j);
        float y0 = 3. + sc * (3.8 + fj * 7.2), y1 = y0 + sc * 6.1;
        float w0 = sc * (7.4 - fj * 1.9), w1 = w0 * .82;
        opU(r, sdSquareSail(m, .35, y0, y1, w0, w1, sc * 1.5 * (1. - .15 * fj)), 7.);
        opU(r, sdCap(m, vec3(.3, y1 + .15, -w1 - .5), vec3(.3, y1 + .15, w1 + .5), .12 * sc), 8.);
      }
      opU(r, sdCap(s, vec3(mx, 3. + sc * 10.3, .3), vec3(mx - 1.4, sheer(mx) + .3, hullHW(mx) * .97), .05), 10.);
      opU(r, sdCap(s, vec3(mx, top - .5, .2), vec3(mx - 1., 3. + sc * 10.6, 1.05 * sc), .04), 10.);
    }
    opU(r, sdCap(p, vec3(8., 27., 0.), vec3(LB + 9.3, 9.6, 0.), .05), 10.);
    opU(r, sdCap(p, vec3(.5, 29.5, 0.), vec3(8., 6., 0.), .05), 10.);
    opU(r, sdCap(p, vec3(-7.5, 22., 0.), vec3(.5, 6., 0.), .05), 10.);
    float jb = sdBox(p - vec3(LB + 2., 14., 0.), vec3(8., 10., 1.8));
    if (jb < r.x) {
      opU(r, sdSail(p, vec3(LB + 8., 9.3, 0.), vec3(9., 24., 0.), vec3(LB + .5, 7.2, 0.), .8), 7.);
      opU(r, sdSail(p, vec3(LB + 4.5, 8.1, 0.), vec3(8.6, 18., 0.), vec3(LB - 2.5, 6.4, 0.), .7), 7.);
    }
    opU(r, length(p - uLightP[0]) - .3, 14.);
    opU(r, sdCap(p, uLightP[0] - vec3(-.4, 1.4, 0.), uLightP[0] - vec3(0., .3, 0.), .06), 8.);
  } else if (uBoat == 2) {
    // ---- fishing boat: wheelhouse forward, open working deck aft with rods, cooler, jerrycan
    vec3 q = p - vec3(2.6, 3.25, 0.);
    opU(r, sdRBox(q, vec3(1.5, 1.15, 1.55), .08), (q.y > .15 && q.y < .78) ? 4. : 3.);
    opU(r, sdRBox(p - vec3(2.55, 4.47, 0.), vec3(1.8, .07, 1.72), .04), 6.);
    opU(r, sdCap(p, vec3(2., 4.5, 0.), vec3(2., 6.9, 0.), .06), 5.);
    opU(r, sdCap(p, vec3(2., 6.3, -.8), vec3(2., 6.3, .8), .04), 5.);
    opU(r, sdCap(s, vec3(3.3, 4.5, 1.25), vec3(3.1, 8.2, 1.35), .02), 5.);
    opU(r, sdRBox(p - vec3(2.9, 4.68, 0.), vec3(.38, .12, .38), .11), 6.);
    float floorY = sheer(-2.4) - uCock.w;
    opU(r, sdRBox(p - vec3(-2.7, floorY + .36, -.55), vec3(.3, .36, .22), .04), 11.);
    opU(r, sdRBox(p - vec3(-2., floorY + .45, .95), vec3(.45, .45, .35), .05), 12.);
    vec3 dq = p - vec3(.35, floorY + .45, 0.);
    opU(r, sdCyl(vec3(dq.x, dq.z, dq.y), .42, .5), 5.);
    // rods in gunwale holders, splayed out over the wake
    float rb = sdBox(p - vec3(-3.3, 4., 0.), vec3(4., 3.2, HB + 2.));
    if (rb < r.x) {
      for (int k = 0; k < 4; k++) {
        float fk = float(k);
        float bx = -1. - fk * 1.25;
        vec3 base = vec3(bx, sheer(bx) - .1, hullHW(bx) - .2);
        vec3 dir = normalize(vec3(-.25 - fk * .08, 1., .32 + fk * .06));
        opU(r, sdCap(s, base, base + dir * 4.6, .02), 13.);
        opU(r, sdCap(s, base, base + dir * .9, .045), 13.);
        opU(r, sdCyl((s - (base + dir * .55 + vec3(0., 0., -.12))).yxz, .09, .07), 5.);
      }
    }
  } else {
    // ---- sailing yacht: coachroof, mast, boom, mainsail and genoa
    float cr = sdRBox(p - vec3(.6, 1.1, 0.), vec3(2.1, .3, 1.15 - .25 * max(p.x - .6, 0.) / 2.1), .15);
    opU(r, cr, (p.y > 1.12 && p.y < 1.26 && abs(p.x - .6) < 1.7) ? 4. : 3.);
    float rig = sdBox(p - vec3(1., 10.2, .4), vec3(5.6, 9.3, 2.4));
    if (rig < r.x) {
      opU(r, sdCap(p, vec3(1.4, .9, 0.), vec3(1.4, 19., 0.), .1), 5.);
      opU(r, sdCap(p, vec3(1.4, 7.5, -1.2), vec3(1.4, 7.5, 1.2), .04), 5.);
      opU(r, sdCap(p, vec3(1.4, 13., -.85), vec3(1.4, 13., .85), .035), 5.);
      opU(r, sdCap(p, vec3(1.4, 2.35, 0.), vec3(-4.2, 2.45, 1.4), .08), 5.);
      opU(r, sdSail(p, vec3(1.3, 2.45, 0.), vec3(1.3, 18.6, 0.), vec3(-4.2, 2.55, 1.4), .55), 7.);
      opU(r, sdSail(p, vec3(6., 1.45, 0.), vec3(1.6, 16.8, 0.), vec3(-.6, 1.6, 1.9), .7), 7.);
      opU(r, sdCap(p, vec3(6.2, 1.4, 0.), vec3(1.4, 17.2, 0.), .02), 5.);
      opU(r, sdCap(p, vec3(1.4, 19., 0.), vec3(-5.7, 1.05, 0.), .02), 5.);
      opU(r, sdCap(s, vec3(1.4, 17., 0.), vec3(1.1, 1.05, 1.95), .02), 5.);
    }
    opU(r, sdCap(s, vec3(4.6, sheer(4.6) + .6, hullHW(4.6) - .1), vec3(6.3, sheer(6.3) + .55, .08), .025), 5.);
    opU(r, sdCap(s, vec3(-5.6, sheer(-5.6) + .6, hullHW(-5.6) - .1), vec3(-3.5, sheer(-3.5) + .6, hullHW(-3.5) - .1), .025), 5.);
  }
  return r;
}

vec3 boatNormal(vec3 p) {
  const vec2 k = vec2(1, -1) * .0015;
  return normalize(k.xyy * mapBoat(p + k.xyy).x + k.yyx * mapBoat(p + k.yyx).x +
                   k.yxy * mapBoat(p + k.yxy).x + k.xxx * mapBoat(p + k.xxx).x);
}

float traceBoat(vec3 lo, vec3 ld, out float mat) {
  vec3 oc = lo - vec3(uH3.xy, 0.);
  float b = dot(oc, ld), c = dot(oc, oc) - uH3.z * uH3.z;
  float h = b * b - c;
  if (h < 0.) return -1.;
  h = sqrt(h);
  float t = max(-b - h, 0.), tmax = -b + h;
  for (int i = 0; i < 180; i++) {
    vec2 r = mapBoat(lo + ld * t);
    if (r.x < .0015 * (1. + t * .05)) { mat = r.y; return t; }
    t += r.x;
    if (t > tmax) break;
  }
  return -1.;
}

float boatShadow(vec3 p, vec3 l) {
  float res = 1., t = .03;
  for (int i = 0; i < 32; i++) {
    float h = mapBoat(p + l * t).x;
    res = min(res, 10. * h / t);
    t += clamp(h, .02, .6);
    if (res < .01 || t > uH3.z * 1.5) break;
  }
  return clamp(res, 0., 1.);
}

// ---------------------------------------------------------------- sky
vec3 skyBase(vec3 rd) {
  float y = max(rd.y, 0.);
  float sd = max(dot(normalize(vec3(rd.x, 0., rd.z) + 1e-5), normalize(vec3(uSunDir.x, 0., uSunDir.z) + 1e-5)), 0.);
  vec3 col = mix(uHorizon, uZenith, pow(y, .6));
  col = mix(col, uSunHaze, pow(sd, 2.5) * exp(-y * 4.) * .9 * (1. - smoothstep(.3, .8, uSunDir.y)));
  col += uSunHaze * pow(max(dot(rd, uSunDir), 0.), 10.) * .5;
  return col;
}

float cloudD(vec2 uv, int oct) { return fbmFlow(uv, vec2(.018, .006), oct); }

vec3 sky(vec3 rd, int oct, bool sun) {
  vec3 col = skyBase(rd);
  float sd = dot(rd, uSunDir);
  if (uStars > 0. && rd.y > 0.) {
    vec3 sp = floor(rd * 420.);
    float st = hash13(sp);
    float tw = .6 + .4 * sin(uTime * 2. * PI * floor(2. + st * 6.) / uLoop * 8. + st * 40.);
    col += vec3(.8, .85, 1.) * step(.9982, st) * tw * uStars * smoothstep(.0, .25, rd.y) * .9;
  }
  if (sun) col += uSunCol * (smoothstep(.99955, .9998, sd) * 30. + pow(max(sd, 0.), 1200.) * 4.);
  col += uSunCol * pow(max(sd, 0.), 80.) * .25;
  if (rd.y > 0.) {
    vec2 uv = rd.xz / (rd.y + .1) * .9 + vec2(11.3, 4.7);
    float d = cloudD(uv, oct);
    float d2 = cloudD(uv + uSunDir.xz * .09, max(oct - 1, 2));
    float cov = uCover + .22 * smoothstep(.04, .45, rd.y) * step(uSunDir.y, .4) - .18 * pow(max(sd, 0.), 3.) * (1. - smoothstep(0., .2, rd.y));
    float dens = smoothstep(1. - cov - .05, 1. - cov + .3, d);
    float lit = clamp(1. - (d2 - d) * 4.5, 0., 1.4);
    float fwd = pow(max(sd, 0.), 6.);
    vec3 cc = uCloudCol * (.3 + .9 * lit) + uSunCol * .02 * lit * (.3 + 4. * fwd);
    cc += uSunCol * fwd * (1. - dens) * 1.1 * lit;            // silver lining near the sun
    cc += vec3(.55, .6, .9) * uFlash * 3.5 * exp(-length(rd - uFlashDir) * 3.) * lit;
    float fade = smoothstep(0., .18, rd.y);
    cc = mix(skyBase(rd) * .9, cc, fade);
    col = mix(col, cc, dens * .97);
    // light shafts fanning out from a low sun under the cloud deck
    vec3 sr = normalize(cross(uSunDir, vec3(0, 1, 0))), su = cross(sr, uSunDir);
    float ang = atan(dot(rd, sr), dot(rd, su));
    float rays = vnoise(vec2(ang * 11., 4. + .7 * sin(uTime * 2. * PI / uLoop)));
    col += uSunHaze * smoothstep(.35, .9, rays) * pow(max(sd, 0.), 5.) * (1. - dens * .7) * .35 * (1. - smoothstep(.2, .5, uSunDir.y));
  }
  return col;
}

vec3 fogCol(vec3 rd) { return skyBase(normalize(vec3(rd.x, .02, rd.z))); }

vec3 applyFog(vec3 col, vec3 rd, float t) {
  float f = 1. - exp(-t * .00042);
  return mix(col, fogCol(rd) * 1.02, f);
}

// ---------------------------------------------------------------- shading
float wakeFoam(vec2 p, out float turb) {
  turb = 0.;
  float sb = XB - p.x;
  if (sb < -1.5 || sb > 240.) return 0.;
  float az = abs(p.y);
  float arm = HB * .85 + max(sb, 0.) * mix(.3, .2, smoothstep(6., 12., uV));
  float armW = .3 + max(sb, 0.) * .04;
  float armF = exp(-pow((az - arm) / armW, 2.)) * exp(-max(sb, 0.) * .028) * smoothstep(-1.5, .5, sb) * min(uWake, 1.3);
  float ss = -LS - p.x;
  // twin prop wash for the motor boats, a single churned trail otherwise
  bool twin = uBoat == 0 || uBoat == 2;
  float cz = twin ? abs(az - HB * (.42 + .006 * min(max(ss, 0.), 60.))) : az;
  float cen = ss > -.5 ? exp(-pow(cz / ((twin ? HB * .17 : HB * .5) + max(ss, 0.) * (twin ? .022 : .045)), 2.) * 1.2) * exp(-max(ss, 0.) * .012 / max(uWake, .3)) * min(uWake, 1.4) : 0.;
  // hull-hugging white water: the hull "shaving" the sea
  float dPlan = az - hullHW(p.x) * .9;
  float hug = (p.x > -LS && p.x < XB + .8) ? exp(-max(dPlan, 0.) * 2.2) * mix(.35, 1., smoothstep(-LS, XB, p.x)) * min(uWake, 1.) : 0.;
  turb = clamp(cen * 1.3 + hug + armF * .6, 0., 1.);
  if (armF + cen + hug < .004) return 0.;
  float n = fbmFlow(p * vec2(.3, .8), vec2(uV * .3, 0.), 4);
  float n2 = fbmFlow(p * vec2(1.3, 2.4) + 3.1, vec2(uV * 1.3, 0.), 3);
  float n3 = fbmFlow(p * vec2(2.6, 4.) + 9.7, vec2(uV * 2.6, 0.), 2);
  float nn = n * .55 + n2 * .45 + n3 * .3 - .1;
  float age = 1. - exp(-max(ss, 0.) * .025);
  float f = armF * smoothstep(.42, .75, nn);
  f += cen * smoothstep(.05 + .45 * age, .45 + .45 * age, nn) * 1.3;
  f += hug * smoothstep(.25, .6, nn + .15);
  return clamp(f, 0., 1.);
}

vec3 waterNormal(vec2 p, float t, out float raw) {
  int n = int(mix(float(NW), 8., clamp(t / 900., 0., 1.)));
  float e = .04 + t * .0015;
  raw = wavesRaw(p, n);
  float h0 = seaH(p, raw);
  float hx = waterH(p + vec2(e, 0.), n);
  float hz = waterH(p + vec2(0., e), n);
  vec3 N = normalize(vec3(h0 - hx, e, h0 - hz));
  return normalize(mix(N, vec3(0, 1, 0), clamp(t / 3500., 0., .75)));
}

vec3 ambientCol() { return mix(uHorizon, uZenith, .55) * 1.1 + vec3(.5, .55, .8) * uFlash * .6; }

vec3 shadeWater(vec3 p, vec3 rd, float t) {
  float raw;
  vec3 n = waterNormal(p.xz, t, raw);
  float turb;
  float wf = wakeFoam(p.xz, turb);
  if (turb > .01) {
    // churned water in the wake: break up the normals
    vec2 tp = p.xz * vec2(.8, 1.5), tv = vec2(uV * .8, 0.);
    vec2 g = vec2(fbmFlow(tp + 11., tv, 3), fbmFlow(tp + 27., tv, 3)) - .5;
    n = normalize(n + vec3(g.x, 0., g.y) * turb * 1.6);
  }
  vec3 L = uSunDir;
  float cosV = max(dot(-rd, n), 0.);
  float fres = .02 + .98 * pow(1. - cosV, 5.);
  vec3 r = reflect(rd, n); r.y = abs(r.y);
  vec3 refl = sky(r, 3, false);
  // sun glitter
  float rs = max(dot(r, L), 0.);
  vec3 spec = uSunCol * (pow(rs, 900.) * 22. * (1. - .5 * max(L.y, 0.)) + pow(rs, 90.) * .9 * (1. - .7 * max(L.y, 0.)) + pow(rs, 12.) * .04 * (1. - max(L.y, 0.))) * mix(1., .4, clamp(t / 2500., 0., 1.));
  // body colour + light scattered back out of the water + subsurface glow through backlit crests
  float crest = clamp((raw - .45) * 2.2, 0., 1.);
  float sss = pow(clamp(dot(rd, L) * .5 + .5, 0., 1.), 4.) * (.25 + crest * 1.6) * (1. - n.y * .5);
  vec3 body = uWaterDeep * ambientCol() * 3. + uWaterScat * (uSunCol * sss * .3 + ambientCol() * .12 * (.4 + crest));
  body += uWaterScat * uSunCol * max(L.y, 0.) * .22 * (.7 + .6 * crest);
  // wake aeration turns the water milky turquoise
  float ss = -LS - p.x;
  float aer = ss > -1. ? exp(-pow(p.z / (HB + max(ss, 0.) * .09), 2.)) * exp(-max(ss, 0.) * .015) * min(uWake, 1.3) : 0.;
  body += uWaterScat * aer * (ambientCol() * .5 + uSunCol * (.08 + .15 * max(L.y, 0.))) * (.4 + .8 * fbmFlow(p.xz * vec2(.5, 1.2), vec2(uV * .5, 0.), 3));
  // contact shadow next to the hull
  float dPlan = abs(p.z) - hullHW(p.x) * .9;
  float contact = (p.x > -LS - .3 && p.x < XB + 1.) ? exp(-max(dPlan, 0.) * 1.5) : 0.;
  body *= 1. - .5 * contact;
  vec3 col = mix(body, refl, fres) + spec * (1. - contact * .7);

  // foam: wind whitecaps + the boat's wake
  float cap = 0.;
  if (t < 1500.) {
    float fn = fbmFlow(p.xz * .22 + 7.7, vec2(uV * .22, 0.), 4);
    cap = smoothstep(.64, .8, raw + (fn - .5) * .35) * uFoam * smoothstep(1500., 400., t);
    if (cap > .01) cap *= smoothstep(.35, .62, fbmFlow(p.xz * vec2(1.4, 2.2) + 3.3, vec2(uV * 1.4, 0.), 3) + cap * .25);
  }
  float foam = clamp(cap + wf, 0., 1.);
  vec3 foamLit = uSunCol * (max(dot(n, L), 0.) * .35 + .1 + pow(max(dot(rd, L), 0.), 5.) * .25) + ambientCol() * 1.5;
  col = mix(col, foamLit * .85, foam * .92);

  // nav lights reflecting on the water
  float lr = max(uLights - .3, 0.) / .7;
  if (lr > 0.) {
    for (int i = 0; i < 4; i++) {
      if (dot(uLightC[i], uLightC[i]) < 1e-4) continue;
      vec3 lp = uBoatR * uLightP[i] + uBoatP;
      vec3 ld = lp - p; float dl = length(ld); ld /= dl;
      vec3 out_ = transpose(uBoatR) * -ld;   // direction the light shines, boat-local
      if ((i == 1 && out_.z > .2) || (i == 2 && out_.z < -.2) || (i == 3 && out_.x > 0.)) continue;
      float s = pow(max(dot(r, ld), 0.), 220.) * 6. + pow(max(dot(r, ld), 0.), 20.) * .15;
      col += uLightC[i] * s * lr * (i == 3 ? 1.5 : 4.) / (1. + dl * dl * .05);
    }
  }
  return applyFog(col, rd, t);
}

vec3 boatAlbedo(float mat, vec3 lp, out float gloss) {
  gloss = .3;
  float sh = sheer(lp.x);
  if (mat < 1.5) {
    float y = lp.y;
    if (uBoat == 0) {
      gloss = .7;
      vec3 a = vec3(.86, .86, .85);
      if (y < .28) a = vec3(.05, .055, .06);
      if (y > sh - 1.05 && y < sh - .78 && lp.x > -4. && lp.x < 4.6) { a = vec3(.02, .03, .04); gloss = 1.; }
      return a;
    }
    if (uBoat == 1) {
      // dark planked oak, an ochre wale, a row of gun ports, glowing stern gallery
      vec3 a = vec3(.13, .07, .035) * (.75 + .5 * vnoise(vec2(lp.x * .7, lp.y * 3.3) * 2.));
      a *= .8 + .2 * smoothstep(.0, .12, abs(fract(lp.y * 2.6) - .5));
      if (y > 2.45 && y < 2.8) a = vec3(.42, .27, .09);
      if (y > 1.45 && y < 2.15 && fract((lp.x + .6) / 2.4) < .3 && abs(lp.x) < 10.) a = vec3(.015);
      if (lp.x < -LS + .4 - max(y, 0.) * .18 && y > 5.2 && y < 7. && fract(lp.z * .8) < .6) { a = vec3(.9, .55, .2); gloss = .9; }
      return a;
    }
    if (uBoat == 2) {
      // workboat white, rust running down from the gunwale, red bottom
      vec3 a = vec3(.78, .78, .74);
      float rust = smoothstep(.55, .8, vnoise(vec2(lp.x * 3.5, lp.y * .6)) * smoothstep(sh - 1.2, sh, y) + .2 * vnoise(lp.xy * 9.));
      a = mix(a, vec3(.35, .18, .08), rust * .8);
      if (y > sh - .12) a = vec3(.45, .3, .16);
      if (y < .3) a = vec3(.32, .05, .04);
      return a;
    }
    vec3 a = vec3(.88, .88, .87); gloss = .7;
    if (y < .15) a = vec3(.03, .05, .12);
    else if (y < .24) a = vec3(.02, .04, .1);
    return a;
  }
  if (mat < 2.5) {
    if (uBoat == 2 && lp.y > sheer(lp.x) - uCock.w + .05) {
      // inside of the bulwarks: chipped white paint
      gloss = .3;
      return mix(vec3(.8, .8, .76), vec3(.4, .26, .12), smoothstep(.6, .85, vnoise(vec2(lp.x * 4., lp.y * 1.5))));
    }
    if (uBoat == 2) {
      float rust = smoothstep(.4, .85, fbm(lp.xz * 1.3, 4) + .15 * vnoise(lp.xz * 12.));
      gloss = .15;
      return mix(vec3(.08, .3, .34), vec3(.22, .11, .05), rust);
    }
    // teak planking
    float plank = smoothstep(0., .08, abs(fract(lp.z * 6.) - .5));
    gloss = .15;
    vec3 teak = uBoat == 1 ? vec3(.32, .2, .1) : vec3(.46, .29, .14);
    return teak * (.6 + .4 * plank) * (.85 + .3 * vnoise(lp.xz * vec2(.6, 6.)));
  }
  if (mat < 3.5) { gloss = .5; return vec3(.86, .86, .84); }
  if (mat < 4.5) { gloss = 1.; return vec3(.015, .02, .028); }
  if (mat < 5.5) { gloss = .8; return vec3(.62, .64, .66); }
  if (mat < 6.5) { gloss = .5; return vec3(.88, .88, .86); }
  if (mat < 7.5) { gloss = .05; return uBoat == 1 ? vec3(.8, .72, .55) : vec3(.9, .9, .88); }
  if (mat < 8.5) { gloss = .1; return vec3(.15, .08, .04); }
  if (mat < 9.5) { gloss = .05; return vec3(.78, .72, .6); }
  if (mat < 10.5) { gloss = .05; return vec3(.06, .05, .04); }
  if (mat < 11.5) { gloss = .5; return vec3(.85, .62, .04); }
  if (mat < 12.5) { gloss = .4; return vec3(.04, .26, .17); }
  if (mat < 13.5) { gloss = .6; return vec3(.03); }
  gloss = 1.; return vec3(.9, .6, .25);
}

vec3 shadeBoat(vec3 lp, vec3 rd, vec3 wp, float t, float mat) {
  vec3 nl = boatNormal(lp);
  vec3 n = uBoatR * nl;
  vec3 L = uSunDir;
  vec3 Ll = transpose(uBoatR) * L;
  float gloss;
  vec3 alb = boatAlbedo(mat, lp, gloss);

  // wet hull just above the waterline
  float wh = waterH(wp.xz, NMARCH);
  float wet = mat < 1.5 ? smoothstep(wh + .6, wh, wp.y) : 0.;
  alb *= 1. - .35 * wet;
  gloss = mix(gloss, 1., wet);

  float sh = boatShadow(lp + nl * .01, Ll);
  bool sheet = mat > 6.5 && mat < 7.5;
  float ndl = dot(n, L);
  float dif = (sheet ? abs(ndl) : max(ndl, 0.)) * sh;
  float ao = clamp(.5 + .5 * mapBoat(lp + nl * .25).x / .25, 0., 1.);
  vec3 amb = ambientCol() * (.45 + .35 * n.y) * ao;
  vec3 bounce = (uWaterScat * .3 + uSunCol * .03) * clamp(-n.y * .5 + .5, 0., 1.) * ao;
  vec3 col = alb * (uSunCol * dif * .9 + amb + bounce);
  // sailcloth glows when the sun is behind it
  if (sheet) col += alb * uSunCol * sh * .45 * max(0., -ndl * sign(dot(n, -rd))) * (.5 + .5 * pow(max(dot(rd, L), 0.), 2.));

  vec3 r = reflect(rd, n);
  float fres = .04 + .96 * pow(1. - max(dot(-rd, n), 0.), 5.);
  vec3 env = sky(vec3(r.x, abs(r.y), r.z), 2, false);
  col += env * fres * gloss * ao * (mat > 3.5 && mat < 4.5 ? 1.2 : .45);
  col += uSunCol * pow(max(dot(r, L), 0.), 80.) * gloss * sh * 2.;
  // rim glow when backlit
  col += uSunHaze * pow(1. - max(dot(-rd, n), 0.), 4.) * pow(max(dot(rd, L), 0.), 2.) * .35;
  // cabin glow and lanterns at night
  if (mat > 3.5 && mat < 4.5) col += vec3(1., .7, .4) * .06 * uLights;
  if (mat > 13.5) col += vec3(1., .65, .3) * (1. + 5. * uLights);
  if (uBoat == 1 && mat < 1.5 && alb.r > .8) col += vec3(1., .6, .25) * .5 * (.3 + uLights);
  return applyFog(col, rd, t);
}

// spray thrown off the bow, as soft particles in the boat frame
vec4 spray(vec3 lo, vec3 ld, float tScene, vec3 rd) {
  if (uSpray <= .01) return vec4(0.);
  vec3 oc = vec3(XB - 2., 1.2, 0.) - lo;
  float tc = dot(oc, ld);
  if (dot(oc, oc) - tc * tc > 64.) return vec4(0.);
  float spd = sqrt(uV / 8.);
  float acc = 0.;
  for (int i = 0; i < NSPRAY; i++) {
    float fi = float(i) + uSeed;
    float s1 = hash11(fi * 1.37), s2 = hash11(fi * 2.71 + 4.), s3 = hash11(fi * 3.17 + 9.);
    float s4 = hash11(fi * 5.03 + 1.), s5 = hash11(fi * 7.11 + 3.), s6 = hash11(fi * 1.91 + 7.);
    float cyc = max(1., floor(uLoop / (.55 + .8 * s1)));   // whole number of lifetimes per loop
    float ph = fract(uTime * cyc / uLoop + s2);
    float age = ph * uLoop / cyc;
    float side = (i & 1) == 0 ? 1. : -1.;
    float x0 = XB - .2 - s3 * 3.4;
    vec3 p0 = vec3(x0, .1, side * (hullHW(x0) * .9 + .15));
    float push = smoothstep(-1.5, XB, x0);
    vec3 v0 = vec3(-(1.2 + 2.6 * s4) * spd, (1.6 + 3.8 * s5) * (.4 + .6 * push) * uSpray * spd, side * (1.4 + 3.2 * s6) * (.5 + .5 * push) * spd);
    vec3 pos = p0 + v0 * age + vec3(-2.2, -9.81, 0.) * .5 * age * age;
    if (pos.y < -.2) continue;
    float rad = .05 + .28 * age;
    vec3 d = pos - lo;
    float tp = dot(d, ld);
    if (tp < 0. || tp > tScene) continue;
    float d2 = dot(d, d) - tp * tp;
    float life = 1. - ph;
    acc += life * exp(-d2 / (rad * rad)) * (.3 + .5 * push) * uSpray;
  }
  float a = 1. - exp(-acc * 1.6 * mix(1., .35, abs(ld.y)));
  float fwd = pow(max(dot(rd, uSunDir), 0.), 6.);
  vec3 c = uSunCol * (.12 + .25 * max(uSunDir.y, 0.) + 1.6 * fwd) + ambientCol() * 1.1;
  return vec4(c * .9, a * .85);
}

vec3 aces(vec3 x) { return clamp((x * (2.51 * x + .03)) / (x * (2.43 * x + .59) + .14), 0., 1.); }

void main() {
  vec2 uv = (gl_FragCoord.xy - .5 * uRes) / uRes.y;
  vec3 ro = uCamPos;
  vec3 fw = normalize(uCamTgt - ro);
  vec3 rt = normalize(cross(fw, uCamUp));
  vec3 up = cross(rt, fw);
  vec3 rd = normalize(fw + (uv.x * rt + uv.y * up) * 2. * tan(uFov * .5));

  mat3 Rt = transpose(uBoatR);
  vec3 lo = Rt * (ro - uBoatP), ld = Rt * rd;
  float mat = 0.;
  float tb = traceBoat(lo, ld, mat);
  float tw = traceWater(ro, rd);

  bool useBoat = tb > 0. && (tw < 0. || tb < tw);
  if (!useBoat && tb > 0. && tw > 0.) {
    // water that would poke through the hull is hidden by it
    if (sdHullSolid(Rt * (ro + rd * tw - uBoatP)) < 0.) useBoat = true;
  }

  vec3 col; float tScene;
  if (useBoat) {
    tScene = tb;
    col = shadeBoat(lo + ld * tb, rd, ro + rd * tb, tb, mat);
  } else if (tw > 0.) {
    tScene = tw;
    col = shadeWater(ro + rd * tw, rd, tw);
  } else {
    tScene = 1e5;
    col = sky(rd, 5, true);
  }

  vec4 sp = spray(lo, ld, tScene, rd);
  col = mix(col, sp.rgb, sp.a);

  // glow halos around the nav lights
  if (uLights > 0.) {
    for (int i = 0; i < 4; i++) {
      if (dot(uLightC[i], uLightC[i]) < 1e-4) continue;
      vec3 d = uLightP[i] - lo;
      float tp = dot(d, ld);
      if (tp < 0. || tp > tScene + .4) continue;
      vec3 toCam = -normalize(d);
      // port light shows to port, starboard to starboard, stern light only aft

    return { pos, tgt: [c.tgt[0], c.tgt[1] + st.heave * 0.4, c.tgt[2]], up: c.up || [0, 1, 0], fov };
  }

  function render(t) {
    const s = SCENES[sceneName], boat = BOATS[boatName];
    phasesAt(t, PH);
    gl.uniform1fv(loc.uPh, PH);
    gl.uniform1f(loc.uTime, t);
    const b = boatState(t, s.H, boat);
    const R = rotMat(b.yaw, b.pitch, b.roll);
    gl.uniformMatrix3fv(loc.uBoatR, false, R);
    gl.uniform2fv(loc.uBoatSlope, R.slope);
    gl.uniform3f(loc.uBoatP, 0, b.heave, 0);
    gl.uniform1f(loc.uSpray, b.spray * num('spray', 1));
    const cam = camera(t, boat, b, R);
    gl.uniform3fv(loc.uCamPos, CAM_OVERRIDE ?? cam.pos);
    gl.uniform3fv(loc.uCamTgt, TGT_OVERRIDE ?? cam.tgt);
    gl.uniform3fv(loc.uCamUp, cam.up);
    gl.uniform1f(loc.uFov, cam.fov);
    if (s.storm) { const f = flashAt(t); gl.uniform1f(loc.uFlash, f.f); v3('uFlashDir', f.dir); }
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }

  const hud = document.getElementById('hud');
  let hudOn = SHOW_HUD, clock = 0, last = performance.now(), lastDraw = 0, fpsAvg = 60, frameMsAvg = 16, adaptTimer = 0;
  function drawHud() {
    hud.style.display = hudOn ? 'block' : 'none';
    if (!hudOn) return;
    hud.innerHTML = `<b>${BOATS[boatName].label}</b> &middot; ${SCENES[sceneName].label} &middot; ${viewName} view<br>` +
      `loop ${LOOP}s &middot; t = ${(clock % LOOP).toFixed(1)}s &middot; ${fpsAvg.toFixed(0)} fps &middot; ${canvas.width}&times;${canvas.height}<br>` +
      `<kbd>B</kbd> boat &nbsp; <kbd>S</kbd> sky &amp; sea &nbsp; <kbd>C</kbd> camera &nbsp; <kbd>F</kbd> fullscreen<br>` +
      `<kbd>R</kbd> record one seamless loop (.webm) &nbsp; <kbd>H</kbd> hide`;
  }

  function frame(now) {
    requestAnimationFrame(frame);
    if (FPS < 60 && now - lastDraw < 1000 / FPS - 2) return;
    let dt = Math.min(0.1, (now - last) / 1000);
    last = now; lastDraw = now;
    clock += dt;
    const t = FREEZE ?? (clock % LOOP);
    render(t);
    // adaptive resolution: keep it smooth on laptops
    fpsAvg += (1 / Math.max(dt, 1e-3) - fpsAvg) * 0.05;
    frameMsAvg += (dt * 1000 - frameMsAvg) * 0.05;
    adaptTimer += dt;
    if (fixedScale === null && !recorder && adaptTimer > 2) {
      adaptTimer = 0;
      const target = 1000 / Math.min(FPS, 60);
      if (frameMsAvg > target * 1.3 && scale > 0.4) { scale = Math.max(0.4, scale - 0.1); resize(); }
      else if (frameMsAvg < target * 1.05 && scale < 1) { scale = Math.min(1, scale + 0.05); resize(); }
    }
    if (hudOn && (now | 0) % 4 === 0) drawHud();
  }

  // ------------------------------------------------------------ record one exact loop
  let recorder = null;
  function record() {
    if (recorder || !canvas.captureStream || !window.MediaRecorder) return;
    const stream = canvas.captureStream(60);
    const type = ['video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'].find(t => MediaRecorder.isTypeSupported(t));
    recorder = new MediaRecorder(stream, { mimeType: type, videoBitsPerSecond: 24e6 });
    const chunks = [];
    recorder.ondataavailable = e => e.data.size && chunks.push(e.data);
    recorder.onstop = () => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob(chunks, { type: 'video/webm' }));
      a.download = `ocean-run-${boatName}-${sceneName}-${viewName}-${LOOP}s.webm`;
      a.click();
      recorder = null; document.getElementById('rec').style.display = 'none';
    };
    clock = 0;   // start exactly at the loop seam
    recorder.start();
    document.getElementById('rec').style.display = 'block';
    setTimeout(() => recorder && recorder.stop(), LOOP * 1000);
  }

  const next = (list, cur) => list[(list.indexOf(cur) + 1) % list.length];
  addEventListener('keydown', e => {
    if (recorder) return;
    const k = e.key.toLowerCase();
    if (k === 'h') { hudOn = !hudOn; drawHud(); }
    else if (k === 'f') { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.(); }
    else if (k === 'r') record();
    else if (k === 'b') {
      boatName = next(BOAT_NAMES, boatName);
      sceneName = BOATS[boatName].scene; viewName = BOATS[boatName].view;
      applyBoat(); applyScene(); drawHud();
    }
    else if (k === 's') { sceneName = next(SCENE_NAMES, sceneName); applyScene(); drawHud(); }
    else if (k === 'c') { viewName = next(VIEWS, viewName); drawHud(); }
  });
  document.addEventListener('visibilitychange', () => { last = performance.now(); });
  drawHud();
  if (P.has('still')) { resize(); render(FREEZE ?? 0); document.title = 'ready'; }
  else requestAnimationFrame(t => { last = t; frame(t); });
  window.__ocean = { render, LOOP, setScale: s => { fixedScale = scale = s; resize(); } };
})();
</script>
</body>
</html>
