# Renders one seamless loop of the wallpaper to an .mp4 (H.264, for Muro and other video
# wallpaper apps) and stores it in result/ and in the "videos" release.
#
# Start it from the Actions tab: "Render wallpaper video" → "Run workflow".
# GitHub's machines have no GPU, so frames are rendered in software (the realistic renderer
# takes roughly 30 s per 2560x1600 frame); the work is split across many machines in
# parallel and joined at the end.
name: Render wallpaper video

on:
  workflow_dispatch:
    inputs:
      renderer:
        description: Renderer ("realistic" is the WebGPU ocean; "basic" is the lighter WebGL one)
        type: choice
        options: [realistic, basic]
        default: realistic
      boat:
        description: Boat (realistic renderer - galleon, fishing and sailboat need a model in models/)
        type: choice
        options: [yacht, galleon, fishing, sailboat]
        default: yacht
      scene:
        description: Sky and sea ("default" uses the boat's own; night is basic renderer only)
        type: choice
        options: [default, tropical, golden, overcast, clear, sunset, storm, night]
        default: default
      view:
        description: Camera ("default" uses the boat's own)
        type: choice
        options: [default, chase, drone, side, deck]
        default: default
      loop:
        description: Loop length in seconds
        type: choice
        options: ['30', '60']
        default: '30'
      resolution:
        description: Video size (MacBook Air is 2560x1664, MacBook Pro 14" is 3024x1964)
        type: choice
        options: ['1920x1080', '2560x1440', '2560x1600', '2560x1664', '2880x1800', '3024x1964', '3840x2160']
        default: '2560x1600'
      fps:
        description: Frames per second
        type: choice
        options: ['30', '24', '60']
        default: '30'
      extra:
        description: Extra options, e.g. speed=10&seed=3 (letters, digits, = & . , - only)
        type: string
        default: ''

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      frames: ${{ steps.plan.outputs.frames }}
      query: ${{ steps.plan.outputs.query }}
      name: ${{ steps.plan.outputs.name }}
      width: ${{ steps.plan.outputs.width }}
      height: ${{ steps.plan.outputs.height }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        env:
          RENDERER: ${{ inputs.renderer }}
          BOAT: ${{ inputs.boat }}
          SCENE: ${{ inputs.scene }}
          VIEW: ${{ inputs.view }}
          LOOP: ${{ inputs.loop }}
          RES: ${{ inputs.resolution }}
          FPS: ${{ inputs.fps }}
          EXTRA: ${{ inputs.extra }}
        run: |
          if ! [[ "$EXTRA" =~ ^[A-Za-z0-9=\&.,_-]*$ ]]; then echo "::error::extra options may only use letters, digits and = & . , _ -"; exit 1; fi
          # each boat's own scene and camera, as in index.html, for the file name
          case "$BOAT" in
            yacht) ds=tropical dv=drone ;; galleon) ds=golden dv=side ;;
            fishing) ds=overcast dv=deck ;; sailboat) ds=clear dv=chase ;;
          esac
          if [ "$RENDERER" = realistic ]; then
            if [ "$SCENE" = night ]; then echo "::error::the night scene is only in the basic renderer"; exit 1; fi
            if [ "$BOAT" != yacht ] && ! grep -q "OCEAN_MODELS\[\"$BOAT\"\]" models/models.js; then
              echo "::error::the realistic renderer needs a 3D model for the $BOAT: add models/$BOAT.glb, run node tools/pack-models.mjs and push"; exit 1
            fi
          fi
          [ "$SCENE" = default ] && SCENE=$ds
          [ "$VIEW" = default ] && VIEW=$dv
          W=${RES%x*} H=${RES#*x}
          query="boat=$BOAT&scene=$SCENE&view=$VIEW&loop=$LOOP${EXTRA:+&$EXTRA}"
          tag=$([ "$RENDERER" = basic ] && echo "-basic" || true)
          name="ocean-run-$BOAT-$SCENE-$VIEW-${LOOP}s-${W}x${H}-${FPS}fps$tag.mp4"
          # split the frames so each machine works for about 25 minutes. Software rendering
          # estimates: realistic ~1 s + 7 s per megapixel per frame, plus ~7 min of warm-up
          # (the sea's foam settling) per machine; basic ~12 s per 1080p frame.
          shards=$(node -e '
            const [frames, w, h, realistic] = process.argv.slice(1).map(Number);
            const mp = w * h / 1e6;
            const secs = realistic ? 1 + 7 * mp : 12 * mp / 2.07;
            const budget = realistic ? 1500 - 420 : 1500;
            let per = Math.max(8, Math.floor(budget / secs));
            if (Math.ceil(frames / per) > 64) per = Math.ceil(frames / 64);
            const out = [];
            for (let s = 0, i = 0; s < frames; s += per, i++) out.push({ i, start: s, end: Math.min(frames, s + per) });
            console.log(JSON.stringify(out));
          ' "$((LOOP * FPS))" "$W" "$H" "$([ "$RENDERER" = realistic ] && echo 1 || echo 0)")
          {
            echo "shards=$shards"; echo "frames=$((LOOP * FPS))"; echo "query=$query"
            echo "name=$name"; echo "width=$W"; echo "height=$H"
          } >> "$GITHUB_OUTPUT"
          echo "Rendering $name: $((LOOP * FPS)) frames on $(echo "$shards" | grep -o '"i"' | wc -l) machines" >> "$GITHUB_STEP_SUMMARY"

  render:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: true
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install ffmpeg
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - name: Install Playwright and Chromium
        working-directory: tools
        run: npm install --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Render frames ${{ matrix.shard.start }} to ${{ matrix.shard.end }}
        working-directory: tools
        env:
          QUERY: ${{ needs.plan.outputs.query }}
          W: ${{ needs.plan.outputs.width }}
          H: ${{ needs.plan.outputs.height }}
          FPS: ${{ inputs.fps }}
          START: ${{ matrix.shard.start }}
          END: ${{ matrix.shard.end }}
          IDX: ${{ matrix.shard.i }}
          RENDERER: ${{ inputs.renderer }}
        run: node render-video.mjs --renderer "$RENDERER" --query "$QUERY" --width "$W" --height "$H" --fps "$FPS" --start "$START" --end "$END" --out "seg-$(printf %03d "$IDX").mp4"
      - uses: actions/upload-artifact@v4
        with:
          name: seg-${{ matrix.shard.i }}
          path: tools/seg-*.mp4
          retention-days: 1

  combine:
    needs: [plan, render]
    runs-on: ubuntu-latest
    concurrency:
      group: store-result
      cancel-in-progress: false
    env:
      NAME: ${{ needs.plan.outputs.name }}
      FRAMES: ${{ needs.plan.outputs.frames }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - uses: actions/download-artifact@v4
        with:
          pattern: seg-*
          path: segs
          merge-multiple: true
      - name: Join the pieces and check the frame count
        run: |
          ls segs/seg-*.mp4 | sort | sed "s|^|file '$PWD/|; s|\$|'|" > list.txt
          mkdir -p result
          ffmpeg -y -loglevel error -f concat -safe 0 -i list.txt -c copy -movflags +faststart -tag:v avc1 "result/$NAME"
          n=$(ffprobe -v error -count_packets -select_streams v -show_entries stream=nb_read_packets -of csv=p=0 "result/$NAME")
          if [ "$n" != "$FRAMES" ]; then echo "::error::expected $FRAMES frames, got $n"; exit 1; fi
          ls -la result
      - uses: actions/upload-artifact@v4
        with:
          name: video
          path: result/${{ needs.plan.outputs.name }}
      - name: Add to the "videos" release
        run: |
          gh release view videos >/dev/null 2>&1 || gh release create videos --target "$GITHUB_SHA" --title "Wallpaper videos" \
            --notes "Seamless loops rendered by the \"Render wallpaper video\" workflow. Import them into Muro or any video wallpaper app."
          gh release upload videos "result/$NAME" --clobber
      - name: Store in result/
        run: |
          # GitHub refuses files over 100 MB: the release keeps the full-quality video, and
          # result/ gets a copy re-encoded (two-pass) to fit in about 90 MB
          size=$(stat -c %s "result/$NAME")
          if [ "$size" -gt 95000000 ]; then
            dur=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "result/$NAME")
            kbps=$(awk -v d="$dur" 'BEGIN { printf "%d", 88000000 * 8 / d / 1000 }')
            echo "$NAME is $((size / 1000000)) MB; re-encoding at ${kbps} kbit/s for result/"
            enc="-c:v libx264 -preset medium -b:v ${kbps}k -maxrate $((kbps * 3 / 2))k -bufsize $((kbps * 2))k -bf 0 -g 60 -pix_fmt yuv420p -color_primaries bt709 -color_trc bt709 -colorspace bt709 -an"
            ffmpeg -y -loglevel error -i "result/$NAME" $enc -pass 1 -passlogfile /tmp/x264 -f null /dev/null
            ffmpeg -y -loglevel error -i "result/$NAME" $enc -pass 2 -passlogfile /tmp/x264 -movflags +faststart -tag:v avc1 /tmp/small.mp4
            mv /tmp/small.mp4 "result/$NAME"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "result/$NAME"
          git commit -m "Add rendered video $NAME"
          for i in 1 2 3 4; do
            git push origin "HEAD:$GITHUB_REF_NAME" && exit 0
            git fetch --depth=20 origin "$GITHUB_REF_NAME" && git rebase "origin/$GITHUB_REF_NAME"
          done
          exit 1
      - name: Summary
        run: |
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/videos/$NAME"
          {
            echo "### $NAME"
            echo "- Download: [$NAME]($url)"
            echo "- In the repository: \`result/$NAME\` (re-encoded to fit GitHub's 100 MB limit if it was larger)"
            echo "- $FRAMES frames, loops seamlessly. Import it into Muro as your own video."
          } >> "$GITHUB_STEP_SUMMARY"
